<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef2e7"><meta name="description" content="拖动、松手，将相同的小伙伴合成更大的圆球。六级合成，挑战本局得分。"><title>合成大西瓜</title><link rel="icon" href="./assets/6.png"></head>
